version: '3'

vars:
  PYTHON: '3.12'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies via UV (default groups)
    cmds:
      - uv sync

  lock:
    desc: Resolve uv.lock without upgrading
    cmds:
      - uv lock

  lock-upgrade:
    desc: Upgrade all dependencies in uv.lock and resync
    cmds:
      - uv lock --upgrade
      - uv sync

  test:
    desc: Run pytest on the tests directory
    cmds:
      - uv run pytest tests

  format-check:
    desc: Verify ruff formatting without modifying files
    cmds:
      - uv run ruff format --check .

  lint:
    desc: Run ruff lint
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .

  fix:
    desc: Auto-fix lint issues with ruff
    cmds:
      - uv run ruff check --fix .

  typecheck:
    desc: Run pyright on the project
    cmds:
      - uv run pyright

  mypy:
    desc: Run mypy on the project
    cmds:
      - uv run mypy

  semgrep:
    desc: Run semgrep with the project config
    cmds:
      - uv run semgrep --config semgrep.yml --error --metrics=off -j 1 .

  crosshair:
    desc: Run crosshair contract checker on scripts
    cmds:
      - uv run crosshair check scripts/

  mutmut:
    desc: Run mutmut mutation testing
    cmds:
      - uv run mutmut run

  vulture:
    desc: Run vulture dead code detection on scripts and tests
    cmds:
      - uv run vulture scripts tests

  refurb:
    desc: Run refurb modernization hints on scripts and tests
    cmds:
      - uv run refurb scripts tests

  deptry:
    desc: Run deptry dependency hygiene checks on scripts and tests
    cmds:
      - uv run deptry scripts tests

  interrogate:
    desc: Run interrogate docstring coverage on scripts
    cmds:
      - uv run interrogate scripts

  coverage:
    desc: Run pytest with branch coverage and emit coverage.xml
    cmds:
      - uv run pytest --cov=scripts --cov-branch --cov-report=xml

  diff-cover:
    desc: Verify diff coverage meets the 90 percent threshold
    cmds:
      - uv run diff-cover coverage.xml --fail-under=90

  docstrings:
    desc: Enforce 100 percent docstring coverage in scripts
    cmds:
      - uv run interrogate --fail-under=100 scripts/

  compile:
    desc: Byte-compile all Python sources, skipping cache and VCS directories
    cmds:
      - uv run python -m compileall -q -x '(^|/)(\.jj|\.git|\.venv|\.benchmarks|\.hypothesis|\.mypy_cache|\.pytest_cache|\.ruff_cache|build|dist|target)(/|$)' .

  audit:
    desc: Run pip-audit via uv tool with strict reporting
    cmds:
      - uv tool run pip-audit --strict

  ci:
    desc: Run the full quality gate suite in order
    cmds:
      - task: install
      - task: lock
      - task: lock-upgrade
      - task: format-check
      - task: lint
      - task: format
      - task: fix
      - task: typecheck
      - task: mypy
      - task: compile
      - task: docstrings
      - task: interrogate
      - task: test
      - task: coverage
      - task: diff-cover
      - task: semgrep
      - task: crosshair
      - task: mutmut
      - task: vulture
      - task: refurb
      - task: deptry
      - task: audit

  clean:
    desc: Remove build artifacts and cache directories
    cmds:
      - rm -rf .pytest_cache .mypy_cache .ruff_cache .coverage coverage.xml dist build .venv __pycache__