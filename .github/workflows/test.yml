name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Run pytest
        run: uv run python -m py_compile scripts/generate_holzman_rust_dataset.py scripts/run_holzman_candidate_eval.py vendor/SkillOpt/skillopt/envs/holzman_rust/rollout.py
      - name: Run mypy strict
        run: uv run mypy --strict scripts/generate_holzman_rust_dataset.py scripts/run_holzman_candidate_eval.py vendor/SkillOpt/skillopt/envs/holzman_rust/rollout.py
      - name: Run ruff
        run: uv run ruff check scripts/generate_holzman_rust_dataset.py scripts/run_holzman_candidate_eval.py vendor/SkillOpt/skillopt/envs/holzman_rust/rollout.py
      - name: Run smoke
        run: uv run python scripts/run_holzman_candidate_eval.py --help
