[project]
name = "skill-moo"
version = "0.2.0"
description = "Holzman Rust SkillOpt generated dataset and candidate evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "mypy>=1.11",
    "pytest>=9.1.1",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pyright]
include = [
    "scripts/generate_holzman_rust_dataset.py",
    "scripts/run_holzman_candidate_eval.py",
    "vendor/SkillOpt/skillopt/envs/holzman_rust/rollout.py",
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "candidates",
    "data",
    "dist",
    "docs",
    "reports",
    "runs",
    "vendor",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMatchNotExhaustive = "error"
reportUnusedCallResult = "error"
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
executionEnvironments = [
    { root = ".", extraPaths = ["scripts", "vendor/SkillOpt"] },
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
disallow_any_explicit = false
disallow_any_generics = false
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "scripts/generate_holzman_rust_dataset.py",
    "scripts/run_holzman_candidate_eval.py",
    "vendor/SkillOpt/skillopt/envs/holzman_rust/rollout.py",
]
exclude = "^(vendor|data|docs|reports|runs|candidates|dist|\\.venv)/"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "vendor/SkillOpt/skillopt/envs/holzman_rust"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "candidates",
    "data",
    "dist",
    "docs",
    "reports",
    "runs",
    "vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
ignore = []
