[project]
name = "skill-moo"
version = "0.2.0"
description = "Holzman Rust SkillOpt generated dataset and candidate evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "expression>=2.0",
    "pyrsistent>=0.20",
    "msgspec>=0.18",
    "icontract>=2.6",
    "beartype>=0.18",
    "typing-extensions>=4.12",
    "skillopt>=0.1.0",
]

[dependency-groups]
typing = [
    "pyright>=1.1.380",
    "mypy>=1.11",
]
test = [
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.108",
    "hypothesis-jsonschema>=0.23",
    "mutmut>=3.0",
]
verify = [
    "crosshair>=0.0.70",
    "crosshair-tool>=0.0.70",
]
lint = [
    "ruff>=0.6",
    "semgrep>=1.85",
    "vulture>=2.11",
    "refurb>=2.0",
    "deptry>=0.20",
    "interrogate>=1.7",
    "diff-cover>=9",
]
io-shell = [
    "httpx>=0.27",
    "outcome>=1.3",
]

[tool.uv]
package = false
default-groups = ["typing", "test", "verify", "lint"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
include = ["scripts", "tests"]
exclude = [
    "vendor",
    "data",
    "candidates",
    "dist",
    "docs",
    "reports",
    "runs",
    ".venv",
    ".jj",
    ".git",
    "build",
    "target",
]
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = ".", extraPaths = ["scripts"] },
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "vendor",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ANN",
    "BLE",
    "EM",
    "TRY",
    "RET",
    "ARG",
    "DTZ",
    "T20",
    "PTH",
    "N",
    "PL",
    "S",
    "PGH",
    "RUF013",
    "B904",
    "C4",
    "ICN",
    "PIE",
    "PT",
]
ignore = [
    "ANN101",
    "ANN102",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["scripts", "tests"]
omit = ["vendor/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.deptry]
ignore_notebooks = true
per_rule_ignores = { DEP001 = ["scripts"], DEP002 = ["pyrsistent", "icontract", "typing-extensions"] }

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
fail-under = 100
exclude = ["vendor", "tests", "docs"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
exclude = "^(vendor|data|docs|reports|candidates|dist|runs|\\.venv|\\.jj|\\.git)/"
explicit_package_bases = true
scripts_are_modules = true

[tool.crosshair]
analysis_kind = ["icontract"]

[tool.mutmut]
paths_to_mutate = "scripts"
tests_dir = "tests"
runner = "uv run pytest tests"

[tool.vulture]
paths = ["scripts", "tests"]
exclude = ["vendor"]
min_confidence = 100

[tool.refurb]
enable_all = true
python_version = "3.12"
